source:
  name: "Wheat disease images (small dataset)"
  doi: "10.5281/zenodo.7573133"
  record_url: "https://zenodo.org/records/7573133"
  download_url: "https://zenodo.org/records/7573133/files/Long%202023%20Plant%20Path%20999%20photos.zip?download=1"
  archive_name: "wheat_999.zip"
  archive_md5: "1f8a7c660c2da137b957fb4edee3dd7d"
  license: "CC-BY-4.0"
  citation: >-
    Long, M. C., Hartley, M., Morris, R. J., & Brown, J. K. M. (2023).
    Wheat disease images (small dataset) [Data set]. Zenodo.
    https://doi.org/10.5281/zenodo.7573133
  declared_image_count: 999
  notes: >-
    Публичное подмножество полного набора на 19 172 изображения. Снимки сделаны
    в реальных условиях роста (поле/теплица), а не в лаборатории.

classes:
  healthy:
    ru: "Здоровое растение"
    aliases: ["healthy", "health", "control", "no_disease"]
  yellow_rust:
    ru: "Жёлтая ржавчина"
    aliases: ["yellow_rust", "yellow rust", "yellowrust", "yr", "stripe_rust"]
  brown_rust:
    ru: "Бурая ржавчина"
    aliases: ["brown_rust", "brown rust", "brownrust", "br", "leaf_rust"]
  septoria:
    ru: "Септориоз"
    aliases: ["septoria", "septoria_leaf_blotch", "stb"]
  mildew:
    ru: "Мучнистая роса"
    aliases: ["mildew", "powdery_mildew", "powderymildew", "pm"]

quality_filters:
  min_side_px: 64
  min_file_bytes: 2048
  allowed_extensions: [".jpg", ".jpeg", ".png", ".bmp", ".tif", ".tiff"]

deduplication:
  exact: true
  phash_hamming_threshold: 4
  scene_group_hamming_threshold: 12

split:
  train: 0.70
  val: 0.15
  test: 0.15
  random_seed: 42
  group_near_duplicates: true

preview:
  samples_per_class: 24
  thumbnail_px: 180
  grid_cols: 6
